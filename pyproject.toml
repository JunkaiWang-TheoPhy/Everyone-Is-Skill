[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "everyone-is-skill"
version = "0.1.0"
description = "Evidence-grounded profile contracts and portable Agent Skill packaging"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Junkai Wang"}]
dependencies = []

[project.scripts]
everyone-skill = "everyone_is_skill.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
